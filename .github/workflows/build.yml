name: Build

on:
    push:
        branches-ignore:
            - main
        tags:
            - '*F*'
    workflow_call:
        inputs:
            tag:
                required: true
                type: string
            ref:
                required: true
                type: string
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

concurrency:
    group: build-${{ inputs.tag || github.ref }}
    cancel-in-progress: false

jobs:
    android:
        if: ${{ github.event.deleted != true && (github.event_name == 'push' || github.event_name == 'schedule' || inputs.ref != '' || github.event.inputs.build_android == 'true') }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.ref || inputs.tag || github.sha }}

            - name: Prepare release metadata
              id: release_meta
              env:
                  RELEASE_INPUT_TAG: ${{ inputs.tag }}
              shell: bash
              run: bash lib/scripts/release-metadata.sh

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write key
              env:
                  SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  set -euo pipefail
                  : "${SIGN_KEYSTORE_BASE64:?Missing signing keystore}"
                  : "${KEYSTORE_PASSWORD:?Missing keystore password}"
                  : "${KEY_ALIAS:?Missing key alias}"
                  : "${KEY_PASSWORD:?Missing key password}"
                  printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
                  printf 'storeFile=key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
                    "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

            - name: Set and Extract version
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Flutter Build Release Apk
              run: flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define-from-file=pili_release.json --no-pub

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliPlus_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ inputs.tag != '' || github.event_name == 'push' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.release_meta.outputs.tag }}
                  name: ${{ steps.release_meta.outputs.name }}
                  target_commitish: ${{ steps.release_meta.outputs.commit }}
                  prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
                  files: PiliPlus_android_*_arm64-v8a.apk
                  fail_on_unmatched_files: true
                  generate_release_notes: true
                  make_latest: ${{ steps.release_meta.outputs.prerelease != 'true' }}

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: PiliPlus_android_*_arm64-v8a.apk
                  if-no-files-found: error
