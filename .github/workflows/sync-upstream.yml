name: Sync upstream

# Merges upstream into main by hand; never tags or releases. To release, push a
# tag such as 2.2.1F.1 (see docs/releases.md).
on:
    workflow_dispatch:
        inputs:
            source:
                description: "release: upstream's latest full release; main: upstream's latest main commit"
                type: choice
                options:
                    - release
                    - main
                default: release

permissions:
    contents: write

concurrency:
    group: sync-upstream
    cancel-in-progress: false

jobs:
    sync:
        if: github.repository == 'ahdiua/PiliPlus'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main
                  fetch-depth: 0
            - name: Merge upstream into main
              env:
                  GH_TOKEN: ${{ github.token }}
                  SYNC_SOURCE: ${{ inputs.source }}
              shell: pwsh
              run: lib/scripts/sync-upstream.ps1
